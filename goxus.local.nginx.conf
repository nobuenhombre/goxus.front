upstream goxus_nextjs {
    server 127.0.0.1:4698;
}

server {
    server_name goxus.ivan;

    access_log /var/log/goxus/nginx-access.log;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    location / {
        proxy_pass http://goxus_nextjs;
    }

    listen 192.168.127.38:80;
}